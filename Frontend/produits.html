<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockManager Pro — Produits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --beige-fond: #E8D8C3;
            --beige-clair: #F7F0E6;
            --creme: #FFF9F2;
            --chocolat: #4A2C24;
            --chocolat-fonce: #321D18;
            --marron: #6B4638;
            --bordeaux: #7A263A;
            --bordeaux-fonce: #5D1C2C;
            --texte-clair: #806D63;
            --bordure: #D8C4AF;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--beige-fond);
            color: var(--chocolat);
            min-height: 100vh;
        }

        nav {
            background: var(--creme);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bordure);
            box-shadow: 0 2px 8px rgba(74,44,36,0.08);
        }

            nav h1 {
                font-size: 20px;
                color: var(--bordeaux);
                font-weight: 700;
            }

            nav a {
                color: var(--texte-clair);
                text-decoration: none;
                font-size: 14px;
                font-weight: 600;
            }

                nav a:hover {
                    color: var(--chocolat);
                }

        .container {
            padding: 32px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

            .toolbar h2 {
                font-size: 22px;
                color: var(--chocolat-fonce);
            }

        .btn-primary {
            padding: 10px 20px;
            background: var(--bordeaux);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(122,38,58,0.18);
            transition: all 0.2s ease;
        }

            .btn-primary:hover {
                background: var(--bordeaux-fonce);
                transform: translateY(-1px);
            }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--creme);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--bordure);
            box-shadow: 0 4px 16px rgba(74,44,36,0.08);
        }

        th {
            background: var(--beige-clair);
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            color: var(--texte-clair);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--bordure);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--bordure);
            font-size: 14px;
            color: var(--chocolat);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--beige-clair);
        }

        .badge-alerte {
            background: var(--bordeaux);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-ok {
            background: #5a8a5a;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(74,44,36,0.4);
            justify-content: center;
            align-items: center;
        }

            .modal-overlay.active {
                display: flex;
            }

        .modal {
            background: var(--creme);
            padding: 36px;
            border-radius: 16px;
            width: 480px;
            border: 1px solid var(--bordure);
            box-shadow: 0 20px 50px rgba(74,44,36,0.2);
            position: relative;
            overflow: hidden;
        }

            .modal::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 5px;
                background: var(--bordeaux);
            }

            .modal h3 {
                margin-bottom: 20px;
                font-size: 18px;
                color: var(--chocolat-fonce);
            }

        .form-group {
            margin-bottom: 16px;
        }

            .form-group label {
                display: block;
                color: var(--chocolat);
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
            }

            .form-group input,
            .form-group select {
                width: 100%;
                padding: 11px 12px;
                background: var(--beige-clair);
                border: 1px solid var(--bordure);
                border-radius: 8px;
                color: var(--chocolat-fonce);
                font-size: 14px;
                outline: none;
                transition: all 0.2s ease;
            }

                .form-group input:focus,
                .form-group select:focus {
                    border-color: var(--bordeaux);
                    box-shadow: 0 0 0 3px rgba(122,38,58,0.08);
                }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: var(--beige-clair);
            color: var(--chocolat);
            border: 1px solid var(--bordure);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

            .btn-secondary:hover {
                background: var(--bordure);
            }
    </style>
</head>
<body>
    <nav>
        <h1>StockManager Pro</h1>
        <a href="dashboard.html">← Dashboard</a>
    </nav>

    <div class="container">
        <div class="toolbar">
            <h2>Produits</h2>
            <button class="btn-primary" onclick="ouvrirModal()">+ Nouveau produit</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Fournisseur</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody id="tableProduits">
                <tr><td colspan="6" style="text-align:center;color:var(--texte-clair);padding:32px;">Chargement...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Nouveau produit</h3>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="nom">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="description">
            </div>
            <div class="form-group">
                <label>Prix</label>
                <input type="number" id="prix" step="0.01">
            </div>
            <div class="form-group">
                <label>Quantité en stock</label>
                <input type="number" id="quantite">
            </div>
            <div class="form-group">
                <label>Seuil d'alerte</label>
                <input type="number" id="seuil">
            </div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="categorieId"></select>
            </div>
            <div class="form-group">
                <label>Fournisseur</label>
                <select id="fournisseurId"></select>
            </div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="creerProduit()">Créer</button>
                <button class="btn-secondary" onclick="fermerModal()">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        const API = "http://localhost:5000/api";

        async function chargerProduits() {
            const res = await fetch(`${API}/Produits`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const produits = await res.json();
            const tbody = document.getElementById("tableProduits");
            tbody.innerHTML = produits.map(p => `
                    <tr>
                        <td>${p.nom}</td>
                        <td>${p.categorieNom}</td>
                        <td>${p.fournisseurNom}</td>
                        <td>${p.prix.toFixed(2)} €</td>
                        <td>${p.quantiteEnStock}</td>
                        <td>${p.quantiteEnStock <= p.seuilAlerte
                    ? '<span class="badge-alerte">Alerte</span>'
                    : '<span class="badge-ok">OK</span>'}</td>
                    </tr>
                `).join("");
        }

        async function ouvrirModal() {
            document.getElementById("modal").classList.add("active");
            const [cats, fours] = await Promise.all([
                fetch(`${API}/Categories`, { headers: { "Authorization": "Bearer " + token } }).then(r => r.json()),
                fetch(`${API}/Fournisseurs`, { headers: { "Authorization": "Bearer " + token } }).then(r => r.json())
            ]);
            document.getElementById("categorieId").innerHTML = cats.map(c => `<option value="${c.id}">${c.nom}</option>`).join("");
            document.getElementById("fournisseurId").innerHTML = fours.map(f => `<option value="${f.id}">${f.nom}</option>`).join("");
        }

        function fermerModal() {
            document.getElementById("modal").classList.remove("active");
        }

        async function creerProduit() {
            const body = {
                nom: document.getElementById("nom").value,
                description: document.getElementById("description").value,
                prix: parseFloat(document.getElementById("prix").value),
                quantiteEnStock: parseInt(document.getElementById("quantite").value),
                seuilAlerte: parseInt(document.getElementById("seuil").value),
                categorieId: parseInt(document.getElementById("categorieId").value),
                fournisseurId: parseInt(document.getElementById("fournisseurId").value)
            };

            await fetch(`${API}/Produits`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            fermerModal();
            chargerProduits();
        }

        chargerProduits();
    </script>
</body>
</html>
